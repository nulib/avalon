---
version: 2.1
orbs:
  samvera: samvera/circleci-orb@1
jobs:
  test:
    working_directory: ~/avr
    docker:
      # Primary container image where all steps run.
      - image: avalonmediasystem/avalon:develop
        environment:
          - DATABASE_URL=postgresql://postgres@localhost:5432/postgres
          - FEDORA_URL=http://localhost:8080/fcrepo/rest
          - FEDORA_TIMEOUT=300
          - RAILS_ENV=test
      # Secondary container image on common network.
      - image: postgres:10-alpine
        environment:
          - POSTGRES_USER=postgres
          - POSTGRES_DB=avalon
          - POSTGRES_PASSWORD=password
      - image: ualbertalib/docker-fcrepo4:4.7
        environment:
          CATALINA_OPTS: '-Djava.awt.headless=true -Dfile.encoding=UTF-8 -server -Xms512m -Xmx1024m -XX:NewSize=256m -XX:MaxNewSize=256m -XX:PermSize=256m -XX:MaxPermSize=256m -XX:+DisableExplicitGC'
      - image: zookeeper:3.4
      - image: solr:9
        environment:
          VERBOSE: yes
          SECURITY_JSON: '{"authentication":{"blockUnknown": false, "class":"solr.BasicAuthPlugin", "credentials":{"solr":"IV0EHq1OnNrj6gvRCwvFwTrZ1+z1oBbnQdiVC3otuq0= Ndd7LKvVBAaZIF0QAVi1ekCfAJXr1GGfLtRUXhgrF8c="}, "realm":"My Solr users", "forwardCredentials": false}, "authorization":{ "class":"solr.RuleBasedAuthorizationPlugin", "permissions":[{"name":"security-edit", "role":"admin"}], "user-role":{"solr":"admin"}}}'
        command: sh -c "server/scripts/cloud-scripts/zkcli.sh -zkhost localhost:2181 -cmd put /security.json \"${SECURITY_JSON}\" && solr-fg -cloud -noprompt  -p << parameters.solr_port >> -z localhost:2181"
      - image: redis:alpine

    parameters:
      ruby_ver:
        description: 'Ruby version'
        default: '3.1'
        type: 'string'
      solr_port:
        type: string
        default: '8985'
      parallelism:
        type: integer
        default: 4
      solr_config_path:
        type: string
        default: 'solr/conf'
      core_name:
        type: string
        default: 'hydra-test'

    working_directory: /home/app/avalon

    parallelism: << parameters.parallelism >>

    steps:
      - run:
          name: Clean out existing code
          command: rm -rf .[!.]* *

      - run: git config --global --add safe.directory /home/app/avalon

      - samvera/cached_checkout

      - run: cp config/controlled_vocabulary.yml.example config/controlled_vocabulary.yml

      - restore_cache:
          keys:
          - v1-bundle-{{ checksum "Gemfile" }}-{{ checksum "Gemfile.local" }}-{{ checksum "Gemfile.lock" }}
          - v1-bundle-
      - restore_cache:
          keys:
          - v1-npm-{{ checksum "yarn.lock" }}
          - v1-npm-
      - run:
          name: Install Dependencies
          command: |
            CC=gcc-7 bundle install --jobs 20 --retry 5 --with aws:postgres --without production --path vendor/bundle
            yarn install
      - save_cache:
          key: v1-bundle-{{ checksum "Gemfile" }}-{{ checksum "Gemfile.local" }}-{{ checksum "Gemfile.lock" }}
          paths:
            - ~/avr/vendor/bundle
      - save_cache:
          key: v1-npm-{{ checksum "yarn.lock" }}
          paths:
            - .cache/yarn

      # Copy solr 8 compliant step from unreleased version of orb
      #- samvera/install_solr_core:
      #    solr_config_path: << parameters.solr_config_path >>
      - run:
          name: Wait for Solr
          command: dockerize -wait tcp://localhost:<< parameters.solr_port >> -timeout 1m
      - run:
          name: Create solr core
          command: |
            if [ -d << parameters.solr_config_path >> ]
            then
              cd << parameters.solr_config_path >>
            else
              if [ -d "$(bundle show active-fedora)/lib/generators/active_fedora/config/solr/templates/solr/conf" ]
              then
                cd "$(bundle show active-fedora)/lib/generators/active_fedora/config/solr/templates/solr/conf"
              else
                cd "$(bundle show active-fedora)/lib/generators/active_fedora/config/solr/templates/solr/config"
              fi
            fi
            zip -1 -r solr_conf.zip ./*
            curl -H "Content-type:application/octet-stream" --data-binary @solr_conf.zip "http://solr:SolrRocks@127.0.0.1:<< parameters.solr_port >>/solr/admin/configs?action=UPLOAD&name=solrconfig"
            curl "http://solr:SolrRocks@127.0.0.1:<< parameters.solr_port >>/solr/admin/collections?action=CREATE&name=hydra-test&numShards=1&collection.configName=solrconfig"
      - run:
          command: bundle exec rake db:migrate

      - run:
          name: Run Spec Tests
          command: |
            cp config/controlled_vocabulary.yml.example config/controlled_vocabulary.yml
            bundle exec rake db:setup zookeeper:upload zookeeper:create spec
      - store_artifacts:
          path: /tmp/test-results
          destination: tests
  publish:
    docker:
      - image: circleci/python:3.7.1
    steps:
      - checkout
      - setup_remote_docker:
          version: 20.10.6
      - run:
          name: Set DEPLOY_TAG from branch name
          command: |
            if [[ $CIRCLE_BRANCH == "master" ]]; then
              echo "export DEPLOY_TAG=production" >> $BASH_ENV
            else
              echo "export DEPLOY_TAG=$(echo $CIRCLE_BRANCH | awk -F/ '{print $NF}')" >> $BASH_ENV
            fi
      - run:
          command: ./cc-test-reporter before-build

      # Pull in the parallel_rspec step and modify it to ensure that test results get stored
      # - samvera/parallel_rspec
      - run: mkdir /tmp/test-results
      - run:
          name: Run rspec in parallel
          command: |
            circleci tests glob "spec/**/*_spec.rb" | circleci tests run --command="xargs bundle exec rspec --format progress --format RspecJunitFormatter -o /tmp/test-results/rspec.xml" --verbose --split-by=timings
      # collect reports
      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
          destination: test-results

      - run:
          command: ./cc-test-reporter format-coverage -t simplecov -o "coverage/codeclimate.$CIRCLE_NODE_INDEX.json"

      - persist_to_workspace:
          root: coverage
          paths:
            - codeclimate.*.json

  upload-coverage:
    parameters:
      parallelism:
        type: integer
        default: 4
    docker:
      # Primary container image where all steps run.
      - image: avalonmediasystem/avalon:7.5.0-dev-ruby3

    working_directory: /home/app/avalon

    steps:
    - run:
        name: Set DEPLOY_TAG from branch name
        command: |
          if [[ $CIRCLE_BRANCH == "master" ]]; then
            echo "export DEPLOY_TAG=production" >> $BASH_ENV
          else
            echo "export DEPLOY_TAG=$(echo $CIRCLE_BRANCH | awk -F/ '{print $NF}')" >> $BASH_ENV
          fi
    - run:
        command: |
          echo "export AWS_ACCESS_KEY_ID=\$${DEPLOY_TAG}_AWS_ACCESS_KEY_ID" >> $BASH_ENV
          echo "export AWS_SECRET_ACCESS_KEY=\$${DEPLOY_TAG}_AWS_SECRET_ACCESS_KEY" >> $BASH_ENV
    - aws-cli/setup
    - run:
        name: Update ECS service
        environment:
          APP_NAME: avr
          ECS_CLUSTER: avr
          ECS_SERVICE: avr-worker
          ECS_TASK: avr-worker
          ECS_CONTAINER: avr
        command: ./.circleci/scripts/update_ecs_service.sh
workflows:
  ci:
    jobs:
      - build:
          ruby_ver: '3.2'
          name: 'Ruby3-2'
          parallelism: 4
      - upload-coverage:
          parallelism: 4
          requires:
            - Ruby3-2
