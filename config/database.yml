# AVR runs on PostgreSQL everywhere.
#
# Deployed environments get a DATABASE_URL (from terraform, via the ECS task
# definition), which Rails applies on top of whatever is here -- so the
# production block below is nominal and the settings that matter are the ones
# for development and test.
#
# Upstream Avalon ships a SQLite config for all three environments. Keeping the
# structure identical to upstream's makes the delta easy to re-apply.
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  port: <%= ENV.fetch("DB_PORT") { 5432 } %>
  username: <%= ENV.fetch("DB_USER") { "docker" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "d0ck3r" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 10 } %>

development:
  <<: *default
  database: avr-development

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  pool: 20
  database: avr-test

production:
  <<: *default
  pool: 20
  database: avr
