---
version: '3.4'
volumes:
  fedora:
  db:
  goaws:
  minio:
  solr:
services:
  db:
    image: postgres:10-alpine
    restart: unless-stopped
    read_only: true
    volumes:
    - type: volume
      source: db
      target: /data
    - type: volume
      target: /tmp
    - type: volume
      target: /var/log
    - type: volume
      target: /var/run
    environment:
    - PGDATA=/data
    - POSTGRES_USER=docker
    - POSTGRES_PASSWORD=d0ck3r
    ports:
    - 5433:5432
    - 5434:5432
    command: postgres -c max_connections=300
    healthcheck:
      test: "CMD echo 'SELECT 1' | PGPASSWORD=d0ck3r psql --host 127.0.0.1 --username docker --dbname docker --quiet --no-align --tuples-only"
      interval: 30s
      timeout: 5s
      retries: 3
  fedora:
    image: samvera/fcrepo4:4.7.5
    restart: unless-stopped
    read_only: true
    volumes:
    - type: volume
      source: fedora
      target: /data
    - type: volume
      target: /tmp
    - type: volume
      target: /var/lib/jetty
    - type: volume
      target: /var/log
    - type: volume
      target: /var/run
    ports:
    - 8984:8080
    - 8986:8080
  goaws-dev:
    image: nulib/goaws
    restart: unless-stopped
    ports:
    - 4101:4101
    volumes:
    - goaws:/data
    - ./extras/goaws/dev.yml:/conf/goaws.yaml
    healthcheck:
      test:
      - CMD
      - wget
      - -O
      - "-"
      - http://localhost:4100/?Action=ListQueues
      interval: 30s
      timeout: 5s
      retries: 3
  goaws-test:
    image: nulib/goaws
    restart: unless-stopped
    ports:
    - 4102:4102
    volumes:
    - goaws:/data
    - ./extras/goaws/test.yml:/conf/goaws.yaml
    healthcheck:
      test:
      - CMD
      - wget
      - -O
      - "-"
      - http://localhost:4100/?Action=ListQueues
      interval: 30s
      timeout: 5s
      retries: 3
  hls:
    depends_on:
    - minio
    image: avalonmediasystem/nginx:minio
    environment:
    - AVALON_DOMAIN=http://host.docker.internal:3000
    - AVALON_STREAMING_BUCKET_URL=https://${DEV_PREFIX}.dev.rdc.library.northwestern.edu:9001/derivatives/
    ports:
    - '8880:80'
  minio:
    image: minio/minio:RELEASE.2021-08-25T00-41-18Z
    restart: unless-stopped
    read_only: true
    volumes:
    - type: volume
      source: minio
      target: /data
    - type: volume
      target: /root/.minio
    - type: bind
      source: $HOME/.dev_cert/dev.rdc.cert.pem
      target: /root/.minio/certs/public.crt
    - type: bind
      source: $HOME/.dev_cert/dev.rdc.key.pem
      target: /root/.minio/certs/private.key
    - type: volume
      target: /tmp
    - type: volume
      target: /var/log
    - type: volume
      target: /var/run
    ports:
      - 9001:9001
      - 9002:9001
      - 19001:19001
      - 19002:19001
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
      MINIO_NOTIFY_WEBHOOK_ENABLE_checksum: on
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_checksum: http://minio-checksum:8000/fixity
    command: server --address ${DEV_PREFIX}.dev.rdc.library.northwestern.edu:9001 --console-address ${DEV_PREFIX}.dev.rdc.library.northwestern.edu:19001 /data
    networks:
      default:
        aliases:
          - ${DEV_PREFIX}.dev.rdc.library.northwestern.edu
    healthcheck:
      test:
      - CMD
      - curl
      - https://${DEV_PREFIX}.dev.rdc.library.northwestern.edu:9001/minio/health/live
      interval: 30s
      timeout: 5s
      retries: 3
  redis:
    image: redis:alpine
    restart: unless-stopped
    read_only: true
    volumes:
    - type: volume
      target: /tmp
    - type: volume
      target: /var/log
    - type: volume
      target: /var/run
    ports:
    - 6380:6379
    healthcheck:
      test:
      - CMD
      - redis-cli
      - ping
      interval: 30s
      timeout: 5s
      retries: 3
  solr:
    image: solr:8-slim
    restart: unless-stopped
    read_only: true
    volumes:
    - type: volume
      source: solr
      target: /opt/solr/server/solr
    - type: volume
      target: /opt/solr/server
    - type: volume
      target: /tmp
    - type: volume
      target: /var/log
    - type: volume
      target: /var/run
    ports:
    - 8983:8983
    - 8985:8983
    - 9983:9983
    - 9985:9983
    command: solr -f -cloud
    healthcheck:
      test:
      - CMD
      - wget
      - "-O"
      - "/dev/null"
      - http://localhost:8983/solr/
      interval: 30s
      timeout: 5s
      retries: 3
